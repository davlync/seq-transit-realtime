name: Record TransLink realtime

# Busy periods only, until Sunday 15 November 2026 (see window.py):
#   weekdays 6-9am and 3-7pm, weekends 11am-3pm, Brisbane time.
# GitHub starts scheduled runs late or drops them, so several triggers fire before and during each window (off the
# top of the hour). The first one to start records to the end of the window; the rest find it covered and exit.
on:
  schedule:
    # from about 1h40 before each window opens; an early run waits, then records the whole window
    - cron: "5,20,35,50 18-22 * * 0-4"   # weekday mornings (UTC, previous day)
    - cron: "5,20,35,50 3-8 * * 1-5"     # weekday afternoons
    - cron: "5,20,35,50 0-4 * * 0,6"     # weekend middays
    - cron: "5,20,35,50 23 * * 5,6"      # weekend 9-10am (UTC, previous day)
  workflow_dispatch: {}

concurrency:
  group: collector            # one recorder at a time; at most one run waits in the queue
  cancel-in-progress: false

permissions:
  contents: write
  actions: write              # to disable this workflow after the end date

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: win
        run: python window.py
      - name: Switch off after the end date
        if: steps.win.outputs.stop == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable collect.yml -R "${{ github.repository }}"
      - name: Record
        if: steps.win.outputs.minutes != '0.0'
        run: |
          sleep ${{ steps.win.outputs.wait }}
          pip install -q pandas gtfs-realtime-bindings
          python collect.py --minutes ${{ steps.win.outputs.minutes }} --interval 30 --out data --chunks
      - name: Commit
        if: steps.win.outputs.minutes != '0.0'
        run: |
          git config user.name "realtime-recorder"
          git config user.email "realtime-recorder@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Realtime data $(TZ=Australia/Brisbane date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
